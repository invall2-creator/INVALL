# Compila l'app i la publica a GitHub Pages (branca gh-pages) cada cop que es puja codi a main.
# L'adreça de Supabase i la clau *publishable* són públiques per disseny (van dins l'app que
# descarrega el navegador). Si es defineixen secrets amb el mateix nom, tenen prioritat.
# MAI posar aquí la clau service_role ni cap altra clau secreta.
name: Publica a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Clau de Google Maps (pública per disseny: s'ha de restringir a invall2-creator.github.io a Google Cloud).
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY || vars.VITE_GOOGLE_MAPS_KEY || '' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://luyagrweeilatutliuwe.supabase.co' }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Z-RXCkp4yjc2Bs7ewnijvg_CcwzKHfb' }}
      - run: touch dist/.nojekyll && echo '{"version":"${{ github.sha }}"}' > dist/version.json
      - name: Publica dist/ a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
